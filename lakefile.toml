name = "erdos"
version = "0.1.0"
defaultTargets = ["Erdos"]

[[lean_lib]]
name = "Erdos"
srcDir = "."
globs = ["conjectures.*"]

# Second-pass formalizations. Only the Mathlib-only files build here; the ones
# importing FormalConjecturesUtil still need the sibling formal-conjectures
# checkout. Not in defaultTargets, so a bare `lake build` ignores them.
[[lean_lib]]
name = "ErdosV2"
srcDir = "."
globs = ["ConjecturesV2.*"]   # ConjecturesV2 is a symlink to conjectures-v2/
                              # (Lake globs need a valid identifier, and
                              #  `conjectures-v2` has a hyphen)

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0" # Match the Lean version reported earlier
